<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Polyglotic: paused (dark taskbar)</title>
  <!-- Symbol A's square on the 16-pixel grid with a pause mark in it, in place of the word's bar and dots, so paused reads at 16 px (polyglotic-hq 146). Every edge on a whole pixel. -->
  <rect x="1" y="1" width="14" height="14" rx="3" fill="#f5f6f7"/>
  <rect x="4" y="4" width="3" height="8" rx="1" fill="#172033"/>
  <rect x="9" y="4" width="3" height="8" rx="1" fill="#172033"/>
</svg>
