<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Polyglotic: listening (dark taskbar)</title>
  <!-- Symbol A on the 16-pixel grid: every edge on a whole pixel. -->
  <rect x="1" y="1" width="14" height="14" rx="3" fill="#f5f6f7"/>
  <rect x="3" y="4" width="10" height="3" rx="1" fill="#172033"/>
  <g fill="#b0185a">
    <rect x="3" y="10" width="2" height="2"/>
    <rect x="7" y="10" width="2" height="2"/>
    <rect x="11" y="10" width="2" height="2"/>
  </g>
</svg>
