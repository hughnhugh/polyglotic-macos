<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Polyglotic (on a dark background)</title>
  <!-- Symbol A with ink and paper swapped and the dots in marker ink, as
       the dark taskbar's tray icon: the logo in the window's dark modes,
       where the ink square would vanish. -->
  <rect width="64" height="64" rx="15" fill="#f5f6f7"/>
  <rect x="13" y="19" width="38" height="11" rx="5.5" fill="#172033"/>
  <g fill="#b0185a">
    <circle cx="17.5" cy="42" r="3.6"/>
    <circle cx="27.2" cy="42" r="3.6"/>
    <circle cx="36.8" cy="42" r="3.6"/>
    <circle cx="46.5" cy="42" r="3.6"/>
  </g>
</svg>
