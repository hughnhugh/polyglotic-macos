# Known vulnerabilities in our dependencies (pip-audit), weekly - and on any
# pull request that changes uv.lock, so Dependabot's updates are audited
# before they merge. On Windows, so Windows-only dependencies are included.
name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - .github/workflows/audit.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Windows)
    # On the user's PC, as the runner's own standard Windows account, not
    # the user (a self-hosted runner: polyglotic-hq project 069, decision
    # 0025 and its 2026-11-06 amendments). Never for outside contributors.
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Export the locked dependencies, with hashes
        run: uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit
        run: uv run --no-sync pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off
