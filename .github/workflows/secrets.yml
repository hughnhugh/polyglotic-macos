# The secret scan (gitleaks) on every pull request and every push to main,
# whatever it changes - Markdown too. Its own workflow so that CI (ci.yml)
# can skip changes to Markdown alone without skipping this (polyglotic-hq
# project 055).
name: Secrets

on:
  pull_request:
    # a draft runs nothing until it's marked ready (decision 0167)
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    if: ${{ !github.event.pull_request.draft }}
    # On the user's PC, in Docker: a self-hosted runner (polyglotic-hq
    # project 069, decision 0025). Never for outside contributors.
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    # The action lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The self-hosted runner's container keeps /tmp between jobs, and the
      # action's download fails if the last run's file is still there
      # (2026-11-06: "Destination file path /tmp/gitleaks.tmp already exists").
      - run: rm -f /tmp/gitleaks.tmp

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal account needs no gitleaks licence. Comments on the
          # pull request would need write access; the failed check is enough.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # No SARIF upload: the log names any finding, and an upload fails
          # the check when the account's artifact storage is full
          # (2026-11-08: "Artifact storage quota has been hit", with no leak).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
