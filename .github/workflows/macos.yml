# The Mac build, proved on GitHub's macOS machine (polyglotic-hq 408, 410;
# decision 0186): by hand only - never on a push or a pull request. GitHub's
# macOS minutes cost money on this private repo (US$0.062 a minute,
# 2026-11-16: about US$2-3 a whole run), so Claude runs it only on the
# user's word (polyglotic-hq DECISIONS #190), with what's needed ticked.
#
# One job on `macos-26` (Apple M1, 3 cores, 7 GB, signed in to a desktop
# session, passwordless sudo, no sound device), each part run even when
# one before it failed, the job failing if any did:
# - tests: the whole suite (Windows-only tests skipped), mypy as macOS sees
#   the code, the import rule;
# - tour: the app from source on macOS's real windows (cocoa), signed in to
#   a stand-in server on the machine, captioning the app's own FLEURS
#   sample fed straight in (tools/app_tour.py); pictures by each window's
#   own grab() and checks.json;
# - pack: Polyglotic.app (PyInstaller, Apple silicon), its parts and
#   signature checked, `--check-install` run on it (tools/package/build.py).
#   Signed with the release's self-signed certificate when the repo has it
#   (secrets MACOS_SIGNING_P12, base64 PKCS#12, and MACOS_SIGNING_PASSWORD:
#   the public copy, polyglotic-hq 422, decision 0196), in a temporary
#   keychain deleted at the end; ad hoc without them (this private repo, a
#   fork);
# - release: pack, for a release - `version` stamped, the certificate
#   required - then Velopack's packages (tools/package/pack.sh, polyglotic-hq
#   430, decision 0202): the full package, the portable zip testers
#   download first (the app with Velopack's UpdateMac in it, signed again
#   with the certificate) and the channel's feed, checked
#   (tools/package/macos_release.py) and kept 1 day with their SHA256SUMS
#   as `macos-release-<run id>` for publish-mac.sh, which signs the feed on
#   the PC - the feed's key never reaches GitHub;
# - updates (on by default, with pack or release): the app updating itself
#   rehearsed - the built app packed as 0.0.1
#   and 0.0.2 into a feed in a folder, 0.0.1 unzipped into ~/Applications,
#   0.0.2 found, downloaded and applied at the next start, and the updated
#   app still verifying with the built app's designated requirement
#   (tools/package/macos_update_rehearsal.sh);
# - measure: BlackHole installed, the sound devices listed, and whether a
#   system-audio permission can be written for a tap (tools/macos_measure.py)
#   - reported, never failing the job;
# - capture: 411's checks on BlackHole (tools/macos_capture_checks.py,
#   polyglotic-hq 412) - afplay heard through one app's tap, everything
#   else, a global and a device tap, the mic, the clock's drift, the packed
#   app's own capture (`--check-capture`), and the permission taken away
#   (NOT_ALLOWED); about 3 minutes plus `drift_minutes`. Fails only on a
#   fail; unknown is what the machine didn't let us see.
# - parity: the Mac's own pieces, in two steps. The caption windows over a
#   full-screen TextEdit, read from the window list (levels and order, never
#   pictures), dictation's typing and key, Esc and clicks elsewhere
#   (tools/macos_full_screen_checks.py, polyglotic-hq 429, 438); then the
#   hotkeys, voice, menu-bar icon and login item
#   (tools/macos_parity_checks.py, polyglotic-hq 428) - ⌃⌘L, P and H
#   pressed by AppleScript, a word said on BlackHole and heard, the packed
#   app's `--check-parity`; about 4 minutes in all. On by default, so a
#   mirror run that names only the older parts runs it too.
#
# How Claude runs it (gh, from a desktop worktree):
#   gh workflow run macos.yml --ref <branch> [-f pack=false -f measure=false ...]
#   gh run list --workflow macos.yml --limit 3          # the run's id
#   gh run watch <id> --exit-status                     # or look later
#   gh run download <id> --dir build/macos-run          # the artifact below
# A release runs on the public copy, which has the certificate (polyglotic-hq
# 422's publish-mac.sh: macos_mirror.sh <ref> --release 0.1.7 --parts pack).
# The artifact `macos-<run id>` (kept 1 day): tour/ (checks.json, *.png),
# pack/ (summary.json, check-install.json), measure.json, capture/
# (capture.json, packed-capture.json, not-allowed.json); and, only with
# keep_app ticked, Polyglotic-macos-arm64.zip (about 150 MB of the
# account's 500 MB artifact storage: delete it once fetched -
# `gh api -X DELETE repos/<repo>/actions/artifacts/<id>`).
name: macOS

on:
  workflow_dispatch:
    inputs:
      tests:
        description: The whole test suite, mypy for macOS, the import rule
        type: boolean
        default: true
      tour:
        description: The app from source on macOS's windows, with replayed captions and pictures
        type: boolean
        default: true
      pack:
        description: Polyglotic.app packed, signed ad hoc and --check-install run on it
        type: boolean
        default: true
      measure:
        description: BlackHole, the sound devices and the system-audio permission, measured
        type: boolean
        default: true
      capture:
        description: Mac capture's checks on BlackHole (taps, the mic, the packed app's capture)
        type: boolean
        default: true
      drift_minutes:
        description: How long the capture part's clock-drift check listens
        type: string
        default: "3"
      parity:
        description: The Mac's own pieces - over full-screen apps, dictation, Esc and clicks (429, 438); hotkeys, voice, menu-bar icon, login item (428)
        type: boolean
        default: true
      keep_app:
        description: Upload the packed app's zip too (about 150 MB, kept 1 day)
        type: boolean
        default: false
      release:
        description: Pack a release (needs version and the signing certificate); keep its zip and SHA-256 1 day
        type: boolean
        default: false
      version:
        description: The release's version, e.g. 0.1.7 (with release)
        type: string
        default: ""
      updates:
        description: With pack or release, the app updating itself, rehearsed (0.0.1 to 0.0.2 from a feed in a folder)
        type: boolean
        default: true
      qa515:
        description: 515's probe of the caption windows (resizing, what's in front)
        type: boolean
        default: true
      sweep515:
        description: 515's sweep of every setting (about 10 minutes)
        type: boolean
        default: false
      probe515:
        description: 515's probe of the caption windows
        type: boolean
        default: true
      old_tree:
        description: A public snapshot to run 515's probe on too (e.g. 0.1.8's)
        type: string
        default: ""

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple silicon)
    runs-on: macos-26
    # minutes are paid for: a stuck run is cut off at about US$4.30
    timeout-minutes: 70
    env:
      TAG: v0.0.1
      CHANNEL: macos-arm64-alpha
      OUT: build/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tags and main, for tests/test_schema_versions.py

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install for macOS (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: The machine
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          uv run --no-sync python -c "import platform, PySide6; print(platform.mac_ver(), PySide6.__version__)"

      - name: The release's version (with release)
        if: ${{ inputs.release }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release needs version, e.g. 0.1.7 (got '$VERSION')"; exit 1
          fi
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build

      - name: Tests (pytest; Windows-only ones skipped)
        if: ${{ !cancelled() && inputs.tests }}
        run: uv run --no-sync pytest -p no:cacheprovider

      # As tools.mypy_platforms says: only Windows' own modules may fail here
      - name: Types as macOS sees them (mypy --platform darwin)
        if: ${{ !cancelled() && inputs.tests }}
        run: uv run --no-sync python -m tools.mypy_platforms darwin

      - name: Import rule (import-linter)
        if: ${{ !cancelled() && inputs.tests }}
        run: uv run --no-sync lint-imports

      # 429: TextEdit full-screen, the caption window's level and place read
      # from the window list; typed words read back through Accessibility
      - name: The caption windows over full-screen apps, and dictation's typing
        if: ${{ !cancelled() && inputs.parity }}
        run: uv run --no-sync python -m tools.macos_full_screen_checks "$OUT/parity/full-screen.json"

      # The pinned sources are checked against their SHA-256 either way
      # (tools/dictionaries/sources.py); the cache only saves downloading.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && (inputs.tour || inputs.pack || inputs.release || inputs.qa515) }}
        with:
          path: build/dictionary-sources
          key: dictionary-sources-${{ hashFiles('tools/dictionaries/sources.py') }}

      - name: The dictionaries, from their pinned sources (the card and the app need them)
        if: ${{ !cancelled() && (inputs.tour || inputs.pack || inputs.release || inputs.qa515) }}
        run: uv run --no-sync python -m tools.dictionaries.build

      - name: The app on macOS's windows, captioning a replayed recording
        if: ${{ !cancelled() && inputs.tour }}
        run: uv run --no-sync python -m tools.app_tour "$OUT/tour" --limit 300

      - name: 515's probe (this tree)
        if: ${{ !cancelled() && inputs.qa515 && inputs.probe515 }}
        run: uv run --no-sync python -m tools.macos_qa515 "$OUT/qa515/now" --limit 420

      - name: 515's Chinese voices (what the Mac says)
        if: ${{ !cancelled() && inputs.qa515 }}
        continue-on-error: true
        timeout-minutes: 8
        run: uv run --no-sync python -m tools.macos_audio515 "$OUT/qa515/audio"

      - name: 515's sweep of every setting
        if: ${{ !cancelled() && inputs.qa515 && inputs.sweep515 }}
        continue-on-error: true
        timeout-minutes: 15
        run: uv run --no-sync python -m tools.macos_sweep515 "$OUT/qa515/sweep" --limit 600

      - name: 515's probe (an older public snapshot's app)
        if: ${{ !cancelled() && inputs.qa515 && inputs.old_tree != '' }}
        continue-on-error: true
        env:
          OLD: ${{ inputs.old_tree }}
        run: |
          git worktree add -f "$RUNNER_TEMP/old" "$OLD"
          PYTHONPATH="$RUNNER_TEMP/old/src" uv run --no-sync python -m tools.macos_qa515 "$OUT/qa515/old" --limit 300

      # The certificate is only ever in this keychain and, for a moment, the
      # runner's temp folder; nothing prints it or its password.
      - name: The signing certificate, in a temporary keychain (ad hoc without it)
        if: ${{ !cancelled() && (inputs.pack || inputs.release) }}
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$P12" ]; then
            if [ "$RELEASE" = true ]; then echo "a release needs the signing certificate"; exit 1; fi
            echo "No signing certificate here: the app is signed ad hoc"; exit 0
          fi
          kc="$RUNNER_TEMP/polyglotic-signing.keychain-db"
          kcpass="$(openssl rand -hex 24)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # self-signed, so not "valid" (-v): its SHA-1 names it exactly
          identity="$(security find-identity -p codesigning "$kc" | awk '/"Polyglotic Mac Signing"/ { print $2; exit }')"
          if [ -z "$identity" ]; then echo "no 'Polyglotic Mac Signing' identity in the certificate"; exit 1; fi
          echo "POLYGLOTIC_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing with Polyglotic Mac Signing ($identity)"

      - name: Polyglotic.app, packed and checked
        if: ${{ !cancelled() && (inputs.pack || inputs.release) }}
        run: |
          # as a release builds it: the app and PyInstaller only (no dev
          # tools, no word splits: decision 0123 keeps simplemma out)
          uv sync --locked --no-default-groups --group package
          status=0
          uv run --no-sync python -m tools.package.build "$TAG" --channel "$CHANNEL" || status=$?
          mkdir -p "$OUT/pack"
          cp build/package/summary.json build/package/check-install.json "$OUT/pack/" 2>/dev/null || true
          if [ "$status" = 0 ] && [ -d dist/Polyglotic.app ]; then
            codesign --verify --deep --strict dist/Polyglotic.app
            codesign --display --verbose=2 dist/Polyglotic.app 2>&1 | grep -E '^(Identifier|Authority|Signature|TeamIdentifier)=' || true
          fi
          exit "$status"

      # Velopack packs a Mac on a Mac only; the .NET SDK it needs, as package.yml
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: ${{ !cancelled() && (inputs.release || (inputs.pack && inputs.updates)) }}
        with:
          dotnet-version: "10.0.x"

      - name: Velopack's packing tool, at the version in .config/dotnet-tools.json
        if: ${{ !cancelled() && (inputs.release || (inputs.pack && inputs.updates)) }}
        run: dotnet tool restore

      # The feed is signed on the PC by publish-mac.sh (the key never comes
      # here), after these files and their SHA256SUMS are checked there.
      - name: The release's packages and feed, signed with the certificate and checked
        if: ${{ !cancelled() && inputs.release }}
        run: |
          codesign --display --verbose=2 dist/Polyglotic.app 2>&1 | grep -qx 'Authority=Polyglotic Mac Signing' ||
            { echo "the release isn't signed with Polyglotic Mac Signing"; exit 1; }
          stamped="v$(jq -r .version build/package/summary.json)"
          [ "$stamped" = "$TAG" ] || { echo "stamped $stamped, asked $TAG"; exit 1; }
          notes=build/version-notes.md
          uv run --no-sync python -m tools.package.release_notes "$TAG" --out "$notes"
          rm -rf build/package/release && mkdir -p build/package/release
          bash tools/package/pack.sh "${TAG#v}" "$CHANNEL" dist/Polyglotic.app build/package/release "" "$notes"
          uv run --no-sync python -m tools.package.macos_release check build/package/release             --version "${TAG#v}" --channel "$CHANNEL" --built dist/Polyglotic.app
          cd build/package/release
          ls -l
          shasum -a 256 -c SHA256SUMS

      - name: The app updating itself, rehearsed (0.0.1 to 0.0.2, applied, still signed)
        if: ${{ !cancelled() && (inputs.pack || inputs.release) && inputs.updates }}
        timeout-minutes: 20
        run: bash tools/package/macos_update_rehearsal.sh dist/Polyglotic.app "$OUT/updates"

      - name: What the machine allows for capture (measured, never failing)
        if: ${{ !cancelled() && inputs.measure }}
        continue-on-error: true
        run: |
          app=()
          if [ -d dist/Polyglotic.app ]; then app=(--app dist/Polyglotic.app); fi
          uv run --no-sync python -m tools.macos_measure "$OUT/measure.json" "${app[@]}"

      # 411's checks (polyglotic-hq 412): fails only on a fail; unknown is what
      # the machine didn't let us see. Installs BlackHole itself if measure
      # didn't run. After pack's `uv sync --no-default-groups`, the dev tools
      # are gone, but the app's own packages (catap, sounddevice) are there.
      - name: Mac capture, checked on BlackHole
        if: ${{ !cancelled() && inputs.capture }}
        env:
          DRIFT_MINUTES: ${{ inputs.drift_minutes }}
        run: |
          app=()
          if [ -d dist/Polyglotic.app ]; then app=(--app dist/Polyglotic.app); fi
          uv run --no-sync python -m tools.macos_capture_checks "$OUT/capture/capture.json" \
            --drift-minutes "$DRIFT_MINUTES" "${app[@]}"

      - name: The Mac's hotkeys, voice, menu-bar icon and login item
        if: ${{ !cancelled() && inputs.parity }}
        run: |
          app=()
          if [ -d dist/Polyglotic.app ]; then app=(--app dist/Polyglotic.app); fi
          uv run --no-sync python -m tools.macos_parity_checks "$OUT/parity" "${app[@]}"

      - name: The temporary keychain, deleted
        if: ${{ always() }}
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" && echo deleted; fi

      - name: Say what ran
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## macOS run"
            if [ -f "$OUT/tour/checks.json" ]; then
              echo "### Tour"
              uv run --no-sync python -c "import json,sys; d=json.load(open(sys.argv[1])); [print(('- pass ' if c['ok'] else '- **FAIL** ') + c['check']) for c in d['checks']]; print('- facts:', json.dumps(d['facts']))" "$OUT/tour/checks.json"
            fi
            if [ -f "$OUT/pack/summary.json" ]; then
              echo "### Pack"
              uv run --no-sync python -c "import json,sys; d=json.load(open(sys.argv[1])); print('- size', d['size_mb'], 'MB, zipped', d['zipped_mb'], 'MB; problems:', d['problems'] or 'none'); s=d.get('signature') or {}; print('- signed by', ', '.join(s.get('authority') or []) or 'ad hoc'); " "$OUT/pack/summary.json"
            fi
            if [ -f build/package/release/SHA256SUMS ]; then
              echo "### Release (SHA-256)"
              echo '~~~'; cat build/package/release/SHA256SUMS; echo '~~~'
            fi
            if [ -f "$OUT/updates/updated-seen.txt" ]; then
              echo "### Updates"
              for r in first update applied after; do
                [ -f "$OUT/updates/$r.json" ] && echo "- $r.json written" || echo "- **no** $r.json"
              done
              echo '~~~'; cat "$OUT/updates/updated-seen.txt"; echo '~~~'
            fi
            if [ -f "$OUT/measure.json" ]; then
              echo "### Measured"
              uv run --no-sync python -c "import json,sys; print('~~~'); print(json.dumps(json.load(open(sys.argv[1]))['summary'], indent=1)); print('~~~')" "$OUT/measure.json"
            fi
            if [ -f "$OUT/parity/parity.json" ]; then
              echo "### Parity"
              uv run --no-sync python -c "import json,sys; [print(f\"- {c['outcome']} {c['check']}: {c['said']}\") for c in json.load(open(sys.argv[1]))['checks']]" "$OUT/parity/parity.json"
            fi
            if [ -f "$OUT/parity/full-screen.json" ]; then
              echo "### Over full-screen apps, dictation, Esc and clicks"
              uv run --no-sync python -c "import json,sys; [print(f\"- {c['outcome']} {c['check']}: {c['said']}\") for c in json.load(open(sys.argv[1]))['checks']]" "$OUT/parity/full-screen.json"
            fi
            if [ -f "$OUT/capture/capture.json" ]; then
              echo "### Capture"
              uv run --no-sync python -c "import json,sys; [print(f\"- {c['outcome']} {c['check']}: {c['said']}\") for c in json.load(open(sys.argv[1]))['checks']]" "$OUT/capture/capture.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep what it found (1 day)
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/tour/*.png
            ${{ env.OUT }}/tour/checks.json
            ${{ env.OUT }}/pack/
            ${{ env.OUT }}/measure.json
            ${{ env.OUT }}/capture/
            ${{ env.OUT }}/parity/
            ${{ env.OUT }}/updates/
            ${{ env.OUT }}/qa515/**/*.png
            ${{ env.OUT }}/qa515/**/*.json
            ${{ env.OUT }}/qa515/**/*.wav
            ${{ env.OUT }}/qa515/**/*.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Keep the release's zip and its SHA-256 (release only; 1 day)
        # a full storage fails no check (344): publish-mac.sh stops if it's missing
        if: ${{ !cancelled() && inputs.release }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-${{ github.run_id }}
          path: build/package/release/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0  # already a zip

      - name: Keep the packed app's zip (only when asked; 1 day)
        if: ${{ !cancelled() && inputs.keep_app }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app-${{ github.run_id }}
          path: build/package/Polyglotic-macos-arm64.zip
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0  # already a zip
